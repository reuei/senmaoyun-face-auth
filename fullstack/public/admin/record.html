<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>认证记录 - 森码云</title>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
:root{--p:#4F46E5;--ph:#4338CA;--pl:#EEF2FF;--s:#10B981;--e:#EF4444;--w:#F59E0B;--i:#3B82F6;--t:#1F2937;--ts:#6B7280;--tm:#9CA3AF;--bg:#F8FAFC;--bw:#FFF;--bd:#E2E8F0;--bl:#F1F5F9;--r:6px;--rl:10px;--rx:14px;--sh:0 1px 3px rgba(0,0,0,.06);--tr:.15s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:var(--bw);border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;box-shadow:var(--sh)}
.side-h{padding:18px 20px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--p)}
.side-nav{flex:1;padding:12px 0;overflow-y:auto}
.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ts);text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all var(--tr)}
.side-nav a:hover{color:var(--t);background:var(--bl)}
.side-nav a.active{color:var(--p);background:var(--pl);border-left-color:var(--p);font-weight:500}
.side-foot{border-top:1px solid var(--bd);padding:8px 0}
.side-foot a{display:flex;align-items:center;gap:8px;padding:10px 20px;color:var(--ts);text-decoration:none;font-size:13px}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bw);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;box-shadow:var(--sh)}
.topbar h2{font-size:17px;font-weight:600}
.content{flex:1;padding:28px}
.card{background:var(--bw);border:1px solid var(--bd);border-radius:var(--rx);padding:24px;box-shadow:var(--sh)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:500}
.badge-s{background:#D1FAE5;color:#10B981}.badge-e{background:#FEE2E2;color:#EF4444}.badge-w{background:#FEF3C7;color:#F59E0B}.badge-i{background:#DBEAFE;color:#3B82F6}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all var(--tr)}
.btn-p{background:var(--p);color:#fff}.btn-s{background:var(--bw);color:var(--t);border-color:var(--bd)}
.btn-sm{padding:5px 12px;font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd)}
table th{font-weight:600;color:var(--ts);background:var(--bl);font-size:12px}
table tbody tr:hover{background:var(--bl)}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.flex-row{display:flex;gap:8px;flex-wrap:wrap}
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;font-size:13px}
.pagination span{color:var(--ts)}
@media(max-width:768px){.sidebar{width:56px}.side-h span:last-child,.side-nav a span,.side-foot a span{display:none}.side-h{justify-content:center;padding:14px 0}.side-nav a{justify-content:center;padding:12px 0}.main{margin-left:56px}.content{padding:14px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="side-h">&#128737; <span>森码云</span></div><nav class="side-nav">
<a href="dashboard.html">&#9632; <span>控制台</span></a>
<a href="driver.html">&#9881; <span>接口管理</span></a>
<a href="record.html" class="active">&#9776; <span>认证记录</span></a>
<a href="audit.html">&#9745; <span>人工审核</span></a>
<a href="token.html">&#128273; <span>Token管理</span></a>
<a href="setting.html">&#9881; <span>系统设置</span></a>
<a href="plugin.html">&#128230; <span>插件中心</span></a>
</nav><div class="side-foot"><a href="/">&#8962; <span>返回首页</span></a><a href="/admin/logout.php">&#10149; <span>退出登录</span></a></div></aside>
<main class="main"><div class="topbar"><h2>认证记录</h2><span style="font-size:13px;color:var(--ts)">管理员</span></div><div class="content">
<div class="card">
<div class="flex-between" style="margin-bottom:16px">
    <div class="flex-row">
        <select id="statusFilter" onchange="load(1)" style="padding:6px 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px">
            <option value="">全部状态</option><option value="success">通过</option><option value="failed">失败</option><option value="auditing">审核中</option>
        </select>
    </div>
    <a href="/api/?action=export_csv" class="btn btn-s btn-sm">导出CSV</a>
</div>
<div class="table-wrap"><table><thead><tr><th>记录编号</th><th>用户ID</th><th>状态</th><th>活体分数</th><th>接口</th><th>时间</th><th>IP</th></tr></thead><tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:30px">加载中...</td></tr></tbody></table></div>
<div id="pager" class="pagination"></div>
</div></div></main>
<script>
var page=1,status='';
var statusMap={success:'<span class="badge badge-s">通过</span>',failed:'<span class="badge badge-e">失败</span>',auditing:'<span class="badge badge-w">审核中</span>',pending:'<span class="badge badge-i">待处理</span>',processing:'<span class="badge badge-i">处理中</span>'};
async function load(p){
    page=p||1;status=document.getElementById('statusFilter').value;
    try{
        var r=await axios.post('/api/?action=admin_records',{page:page});
        if(r.data.code===200){
            var list=r.data.data.list,total=r.data.data.total,limit=20;
            var h='';
            if(list.length===0){h='<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--tm)">暂无记录</td></tr>'}
            else{list.forEach(function(r){h+='<tr><td style="font-family:monospace;font-size:11px">'+(r.record_no||'').substring(0,16)+'...</td><td>'+r.user_id+'</td><td>'+(statusMap[r.status]||r.status)+'</td><td>'+(r.liveness_score||'-')+'</td><td>'+(r.driver_code||'-')+'</td><td style="font-size:12px">'+(r.certify_time||r.create_time)+'</td><td style="font-size:12px">'+r.ip_address+'</td></tr>'})}
            document.getElementById('tbody').innerHTML=h;
            var ph='';
            if(page>1)ph+='<a href="javascript:load('+(page-1)+')" class="btn btn-s btn-sm">上一页</a>';
            ph+='<span>第 '+page+' 页 / 共 '+Math.ceil(total/limit)+' 页 ('+total+' 条)</span>';
            if(page*limit<total)ph+='<a href="javascript:load('+(page+1)+')" class="btn btn-s btn-sm">下一页</a>';
            document.getElementById('pager').innerHTML=ph;
        }
    }catch(e){}
}
load(1);
</script>
</body>
</html>
