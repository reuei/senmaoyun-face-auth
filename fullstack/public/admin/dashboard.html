<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>控制台 - 森码云</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
:root{--p:#4F46E5;--ph:#4338CA;--pl:#EEF2FF;--s:#10B981;--e:#EF4444;--w:#F59E0B;--i:#3B82F6;--t:#1F2937;--ts:#6B7280;--tm:#9CA3AF;--bg:#F8FAFC;--bw:#FFF;--bd:#E2E8F0;--bl:#F1F5F9;--r:6px;--rl:10px;--rx:14px;--sh:0 1px 3px rgba(0,0,0,.06);--tr:.15s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:var(--bw);border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;box-shadow:var(--sh)}
.side-h{padding:18px 20px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--p)}
.side-nav{flex:1;padding:12px 0;overflow-y:auto}
.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ts);text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all var(--tr)}
.side-nav a:hover{color:var(--t);background:var(--bl)}
.side-nav a.active{color:var(--p);background:var(--pl);border-left-color:var(--p);font-weight:500}
.side-foot{border-top:1px solid var(--bd);padding:8px 0}
.side-foot a{display:flex;align-items:center;gap:8px;padding:10px 20px;color:var(--ts);text-decoration:none;font-size:13px}
.side-foot a:hover{color:var(--t)}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bw);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;box-shadow:var(--sh)}
.topbar h2{font-size:17px;font-weight:600}
.content{flex:1;padding:28px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bw);border:1px solid var(--bd);border-radius:var(--rx);padding:20px 24px;box-shadow:var(--sh);transition:all var(--tr)}
.stat-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-2px)}
.stat-card .l{font-size:12px;color:var(--ts);font-weight:500}
.stat-card .v{font-size:28px;font-weight:700;margin:6px 0;line-height:1}
.stat-card .s{font-size:11px;color:var(--tm)}
.card{background:var(--bw);border:1px solid var(--bd);border-radius:var(--rx);padding:24px;box-shadow:var(--sh)}
@media(max-width:768px){.sidebar{width:56px}.side-h span:last-child,.side-nav a span,.side-foot a span{display:none}.side-h{justify-content:center;padding:14px 0}.side-nav a{justify-content:center;padding:12px 0}.main{margin-left:56px}.content{padding:14px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<aside class="sidebar"><div class="side-h">&#128737; <span>森码云</span></div><nav class="side-nav">
<a href="dashboard.html" class="active">&#9632; <span>控制台</span></a>
<a href="driver.html">&#9881; <span>接口管理</span></a>
<a href="record.html">&#9776; <span>认证记录</span></a>
<a href="audit.html">&#9745; <span>人工审核</span></a>
<a href="token.html">&#128273; <span>Token管理</span></a>
<a href="setting.html">&#9881; <span>系统设置</span></a>
<a href="plugin.html">&#128230; <span>插件中心</span></a>
</nav><div class="side-foot"><a href="/">&#8962; <span>返回首页</span></a><a href="/admin/logout.php">&#10149; <span>退出登录</span></a></div></aside>
<main class="main"><div class="topbar"><h2>控制台</h2><span style="font-size:13px;color:var(--ts)">管理员</span></div><div class="content">
<div class="stats-grid" id="statsBox">
    <div class="stat-card"><div class="l">今日认证</div><div class="v">-</div><div class="s">加载中...</div></div>
    <div class="stat-card"><div class="l">通过率</div><div class="v">-</div><div class="s">累计 - 次</div></div>
    <div class="stat-card"><div class="l">待审核</div><div class="v">-</div><div class="s">人工审核队列</div></div>
    <div class="stat-card"><div class="l">主接口</div><div class="v">自研</div><div class="s">默认驱动</div></div>
</div>
<div class="card"><h3 style="margin-bottom:16px">最近7天认证趋势</h3><div id="chart" style="height:300px"></div></div>
</div></main>
<script>
(async function(){
    try{
        var r=await axios.get('/api/?action=admin_stats');
        if(r.data.code===200){
            var s=r.data.data.stats,trend=r.data.data.trend;
            document.getElementById('statsBox').innerHTML=
                '<div class="stat-card"><div class="l">今日认证</div><div class="v">'+s.today_total+'</div><div class="s">通过 '+s.today_success+' 次</div></div>'+
                '<div class="stat-card"><div class="l">通过率</div><div class="v">'+s.pass_rate+'%</div><div class="s">累计 '+s.total+' 次</div></div>'+
                '<div class="stat-card"><div class="l">待审核</div><div class="v">'+s.today_auditing+'</div><div class="s">人工审核队列</div></div>'+
                '<div class="stat-card"><div class="l">主接口</div><div class="v">自研</div><div class="s">默认驱动</div></div>';
            var chart=echarts.init(document.getElementById('chart'));
            chart.setOption({
                tooltip:{trigger:'axis'},grid:{left:40,right:20,top:10,bottom:30},
                xAxis:{type:'category',data:trend.map(function(t){return t.date})},
                yAxis:{type:'value'},
                series:[
                    {name:'总认证',type:'line',data:trend.map(function(t){return t.total}),smooth:true,lineStyle:{color:'#4F46E5'},itemStyle:{color:'#4F46E5'}},
                    {name:'通过',type:'line',data:trend.map(function(t){return t.success}),smooth:true,lineStyle:{color:'#10B981'},itemStyle:{color:'#10B981'},areaStyle:{color:'rgba(16,185,129,.1)'}},
                ]
            });
        }
    }catch(e){}
})();
</script>
</body>
</html>
