<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员登录 - 森码云</title>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
:root{--p:#4F46E5;--ph:#4338CA;--e:#EF4444;--el:#FEE2E2;--t:#1F2937;--ts:#6B7280;--tm:#9CA3AF;--bg:#F8FAFC;--bw:#FFF;--bd:#E2E8F0;--r:8px;--rx:16px;--sh:0 10px 25px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--t)}
.card{background:var(--bw);border-radius:var(--rx);box-shadow:var(--sh);border:1px solid var(--bd);width:100%;max-width:380px;padding:40px}
.card .logo{text-align:center;margin-bottom:8px}
.card .logo svg{width:40px;height:40px;color:var(--p)}
.card h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.card .sub{text-align:center;color:var(--ts);font-size:13px;margin-bottom:28px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.fg input{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;outline:none;transition:border-color .15s}
.fg input:focus{border-color:var(--p);box-shadow:0 0 0 3px #EEF2FF}
.btn{width:100%;padding:11px;background:var(--p);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--ph)}.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{background:var(--el);color:var(--e);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.footer{text-align:center;margin-top:20px}
.footer a{font-size:12px;color:var(--tm);text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>
<h1>森码云管理后台</h1>
<p class="sub">请使用管理员账号登录</p>
<div id="msg"></div>
<form id="loginForm">
<div class="fg"><label>用户名</label><input id="username" autocomplete="username" required></div>
<div class="fg"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div>
<button type="submit" class="btn" id="btn">登录</button>
</form>
<div class="footer"><a href="/">返回首页</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();
    var btn=document.getElementById('btn'),msg=document.getElementById('msg');
    btn.disabled=true;btn.textContent='登录中...';msg.innerHTML='';
    try{
        var r=await axios.post('/admin/login.php',new URLSearchParams({
            username:document.getElementById('username').value,
            password:document.getElementById('password').value
        }));
        if(r.data&&r.data.code===200){window.location.href='/admin/dashboard.html'}
        else{msg.innerHTML='<div class="msg">用户名或密码错误</div>'}
    }catch(e){
        msg.innerHTML='<div class="msg">网络错误，请重试</div>';
    }
    btn.disabled=false;btn.textContent='登录';
});
</script>
</body>
</html>
