<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>接口管理 - 森码云</title>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
:root{--p:#4F46E5;--ph:#4338CA;--pl:#EEF2FF;--s:#10B981;--e:#EF4444;--w:#F59E0B;--i:#3B82F6;--t:#1F2937;--ts:#6B7280;--tm:#9CA3AF;--bg:#F8FAFC;--bw:#FFF;--bd:#E2E8F0;--bl:#F1F5F9;--r:6px;--rl:10px;--rx:14px;--sh:0 1px 3px rgba(0,0,0,.06);--tr:.15s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:var(--bw);border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;box-shadow:var(--sh)}
.side-h{padding:18px 20px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--p)}
.side-nav{flex:1;padding:12px 0;overflow-y:auto}
.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ts);text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all var(--tr)}
.side-nav a:hover{color:var(--t);background:var(--bl)}
.side-nav a.active{color:var(--p);background:var(--pl);border-left-color:var(--p);font-weight:500}
.side-foot{border-top:1px solid var(--bd);padding:8px 0}
.side-foot a{display:flex;align-items:center;gap:8px;padding:10px 20px;color:var(--ts);text-decoration:none;font-size:13px}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bw);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;box-shadow:var(--sh)}
.topbar h2{font-size:17px;font-weight:600}
.content{flex:1;padding:28px}
.card{background:var(--bw);border:1px solid var(--bd);border-radius:var(--rx);padding:24px;box-shadow:var(--sh)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:500}
.badge-s{background:#D1FAE5;color:#10B981}.badge-e{background:#FEE2E2;color:#EF4444}.badge-i{background:#DBEAFE;color:#3B82F6}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all var(--tr)}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--ph)}
.btn-s{background:var(--bw);color:var(--t);border-color:var(--bd)}.btn-s:hover{background:var(--bl)}
.btn-sm{padding:5px 12px;font-size:12px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.fg input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none}
.fg input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.msg-ok{background:#D1FAE5;color:var(--s);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.flex-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mb-16{margin-bottom:16px}
@media(max-width:768px){.sidebar{width:56px}.side-h span:last-child,.side-nav a span,.side-foot a span{display:none}.side-h{justify-content:center;padding:14px 0}.side-nav a{justify-content:center;padding:12px 0}.main{margin-left:56px}.content{padding:14px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="side-h">&#128737; <span>森码云</span></div><nav class="side-nav">
<a href="dashboard.html">&#9632; <span>控制台</span></a>
<a href="driver.html" class="active">&#9881; <span>接口管理</span></a>
<a href="record.html">&#9776; <span>认证记录</span></a>
<a href="audit.html">&#9745; <span>人工审核</span></a>
<a href="token.html">&#128273; <span>Token管理</span></a>
<a href="setting.html">&#9881; <span>系统设置</span></a>
<a href="plugin.html">&#128230; <span>插件中心</span></a>
</nav><div class="side-foot"><a href="/">&#8962; <span>返回首页</span></a><a href="/admin/logout.php">&#10149; <span>退出登录</span></a></div></aside>
<main class="main"><div class="topbar"><h2>接口管理</h2><span style="font-size:13px;color:var(--ts)">管理员</span></div><div class="content">
<div id="msg"></div>
<div class="card">
<p style="color:var(--ts);font-size:13px;margin-bottom:20px">管理人脸识别接口驱动。自研接口默认启用，第三方接口需配置密钥后方可使用。</p>
<div id="drivers"></div>
</div></div></main>
<script>
var drivers=[
    {code:'self',name:'自研活体检测',desc:'默认启用，无需配置。基于GD库实现图像质量检测、亮度分析、纹理复杂度分析。',fields:[],enabled:true,isDefault:true},
    {code:'tencent',name:'腾讯云慧眼',desc:'需开通腾讯云人脸核身服务。支持动作活体+光线活体+远近活体。',fields:[{k:'secret_id',l:'SecretId'},{k:'secret_key',l:'SecretKey'},{k:'region',l:'地域'}],enabled:false,isDefault:false},
    {code:'baidu',name:'百度智能云人脸识别',desc:'需开通百度智能云人脸识别服务。',fields:[{k:'api_key',l:'API Key'},{k:'secret_key',l:'Secret Key'},{k:'app_id',l:'App ID'}],enabled:false,isDefault:false},
    {code:'alipay',name:'支付宝活体检测',desc:'需开通支付宝开放平台活体检测。',fields:[{k:'app_id',l:'AppId'},{k:'private_key',l:'应用私钥'},{k:'alipay_public_key',l:'支付宝公钥'}],enabled:false,isDefault:false},
    {code:'juhe',name:'聚合数据活体检测',desc:'需注册聚合数据。在线图片活体检测V2接口。',fields:[{k:'api_key',l:'API Key'}],enabled:false,isDefault:false},
    {code:'aliyun_market',name:'阿里云市场活体检测',desc:'需在阿里云市场订阅活体检测服务。',fields:[{k:'app_code',l:'AppCode'}],enabled:false,isDefault:false},
];
function render(){
    var h='';
    drivers.forEach(function(d){
        h+='<div style="border:1px solid var(--bd);border-radius:var(--rl);padding:20px;margin-bottom:14px"><div class="flex-between mb-16"><div><strong style="font-size:15px">'+d.name+'</strong><span style="font-size:11px;color:var(--tm);margin-left:8px;font-family:monospace">'+d.code+'</span></div><div style="display:flex;gap:6px"><span class="badge '+(d.enabled?'badge-s':'badge-e')+'">'+(d.enabled?'已启用':'已禁用')+'</span>'+(d.isDefault?'<span class="badge badge-i">默认接口</span>':'')+'</div></div><p style="font-size:12px;color:var(--ts);margin-bottom:14px">'+d.desc+'</p>';
        if(d.fields.length>0){
            h+='<form onsubmit="saveDriver(event,\''+d.code+'\')" style="border-top:1px solid var(--bd);padding-top:14px">';
            d.fields.forEach(function(f){
                h+='<div class="fg"><label>'+f.l+'</label><input type="password" name="'+f.k+'" placeholder="请输入'+f.l+'"></div>';
            });
            h+='<div class="flex-row"><label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" name="enabled" '+(d.enabled?'checked':'')+'> 启用</label><label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" name="is_default" '+(d.isDefault?'checked':'')+'> 设为默认</label><button type="submit" class="btn btn-p btn-sm">保存配置</button></div></form>';
        }else{
            h+='<div style="border-top:1px solid var(--bd);padding-top:14px"><p style="font-size:12px;color:var(--s);font-weight:500">此接口无需配置，始终可用</p></div>';
        }
        h+='</div>';
    });
    document.getElementById('drivers').innerHTML=h;
}
async function saveDriver(e,code){
    e.preventDefault();
    var f=new FormData(e.target),config={};
    for(var p of f.keys()){if(p!=='enabled'&&p!=='is_default')config[p]=f.get(p)}
    try{
        await axios.post('/admin/driver.php',new URLSearchParams({action:'save',driver_code:code,config:JSON.stringify(config),enabled:f.get('enabled')?1:0,is_default:f.get('is_default')?1:0}));
        document.getElementById('msg').innerHTML='<div class="msg-ok">配置保存成功</div>';
    }catch(e){alert('保存失败')}
}
render();
</script>
</body>
</html>
