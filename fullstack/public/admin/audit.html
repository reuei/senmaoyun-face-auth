<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>人工审核 - 森码云</title>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
:root{--p:#4F46E5;--s:#10B981;--e:#EF4444;--w:#F59E0B;--t:#1F2937;--ts:#6B7280;--tm:#9CA3AF;--bg:#F8FAFC;--bw:#FFF;--bd:#E2E8F0;--bl:#F1F5F9;--r:6px;--rx:14px;--sh:0 1px 3px rgba(0,0,0,.06);--tr:.15s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:var(--bw);border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;box-shadow:var(--sh)}
.side-h{padding:18px 20px;border-bottom:1px solid var(--bd);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--p)}
.side-nav{flex:1;padding:12px 0;overflow-y:auto}
.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ts);text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all var(--tr)}
.side-nav a:hover{color:var(--t);background:var(--bl)}
.side-nav a.active{color:var(--p);background:#EEF2FF;border-left-color:var(--p);font-weight:500}
.side-foot{border-top:1px solid var(--bd);padding:8px 0}
.side-foot a{display:flex;align-items:center;gap:8px;padding:10px 20px;color:var(--ts);text-decoration:none;font-size:13px}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bw);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;box-shadow:var(--sh)}
.topbar h2{font-size:17px;font-weight:600}
.content{flex:1;padding:28px}
.card{background:var(--bw);border:1px solid var(--bd);border-radius:var(--rx);padding:24px;box-shadow:var(--sh)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:500}
.badge-s{background:#D1FAE5;color:#10B981}.badge-e{background:#FEE2E2;color:#EF4444}.badge-w{background:#FEF3C7;color:#F59E0B}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all var(--tr)}
.btn-p{background:var(--p);color:#fff}.btn-s{background:var(--bw);color:var(--t);border-color:var(--bd)}.btn-e{background:var(--e);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd)}
table th{font-weight:600;color:var(--ts);background:var(--bl);font-size:12px}
table tbody tr:hover{background:var(--bl)}
.msg-ok{background:#D1FAE5;color:var(--s);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.form-inline{display:flex;gap:6px;align-items:center}
.form-inline input{padding:5px 8px;font-size:11px;border:1px solid var(--bd);border-radius:var(--r);outline:none}
@media(max-width:768px){.sidebar{width:56px}.side-h span:last-child,.side-nav a span,.side-foot a span{display:none}.side-h{justify-content:center;padding:14px 0}.side-nav a{justify-content:center;padding:12px 0}.main{margin-left:56px}.content{padding:14px}}
</style></head><body>
<aside class="sidebar"><div class="side-h">&#128737; <span>森码云</span></div><nav class="side-nav">
<a href="dashboard.html">&#9632; <span>控制台</span></a><a href="driver.html">&#9881; <span>接口管理</span></a>
<a href="record.html">&#9776; <span>认证记录</span></a><a href="audit.html" class="active">&#9745; <span>人工审核</span></a>
<a href="token.html">&#128273; <span>Token管理</span></a><a href="setting.html">&#9881; <span>系统设置</span></a>
<a href="plugin.html">&#128230; <span>插件中心</span></a>
</nav><div class="side-foot"><a href="/">&#8962; <span>返回首页</span></a><a href="/admin/logout.php">&#10149; <span>退出登录</span></a></div></aside>
<main class="main"><div class="topbar"><h2>人工审核</h2><span style="font-size:13px;color:var(--ts)">管理员</span></div><div class="content">
<div id="msg"></div><div class="card"><div class="table-wrap"><table><thead><tr><th>编号</th><th>用户ID</th><th>活体分数</th><th>失败原因</th><th>时间</th><th>操作</th></tr></thead><tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--tm)">暂无待审核记录</td></tr></tbody></table></div></div>
</div></main>
<script>
(async function(){
    try{
        var r=await axios.post('/api/?action=admin_records',{page:1});
        if(r.data.code===200){
            var audits=r.data.data.list.filter(function(r){return r.status==='auditing'});
            if(audits.length>0){
                var h='';
                audits.forEach(function(r){
                    h+='<tr><td style="font-family:monospace;font-size:11px">'+(r.record_no||'').substring(0,14)+'...</td><td>'+r.user_id+'</td><td>'+(r.liveness_score||'-')+'</td><td style="font-size:12px;color:var(--e)">'+(r.fail_reason||'')+'</td><td style="font-size:12px">'+r.create_time+'</td><td><div class="form-inline"><form method="post" action="/admin/audit.php" style="margin:0"><input type="hidden" name="id" value="'+r.id+'"><input type="hidden" name="act" value="pass"><button type="submit" class="btn btn-s btn-sm" style="color:var(--s)">通过</button></form><form method="post" action="/admin/audit.php" style="margin:0"><input type="hidden" name="id" value="'+r.id+'"><input type="hidden" name="act" value="reject"><input type="text" name="reason" placeholder="驳回原因" style="width:80px"><button type="submit" class="btn btn-e btn-sm">驳回</button></form></div></td></tr>'
                });
                document.getElementById('tbody').innerHTML=h;
            }
        }
    }catch(e){}
})();
</script>
</body></html>
