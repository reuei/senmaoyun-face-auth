# 森码云实人认证系统 - Nginx 伪静态配置
# 适用于 Nginx 虚拟主机

server {
    listen 80;
    server_name face.builds.codes;
    root /www/wwwroot/face.builds.codes/public;
    index index.php index.html;

    # 禁止访问敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /(vendor|runtime|config|app)/ {
        deny all;
    }

    # 前端静态资源
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 路由
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 管理后台路由
    location /admin/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 安装向导
    location /install/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 禁止访问 .htaccess
    location ~ /\.ht {
        deny all;
    }
}