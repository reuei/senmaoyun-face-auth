<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>用户注册 - {$site_name}</title>
{if $is_mobile}
<link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
{else}
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/element-plus"></script>
{/if}
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F8FAFC}
.card{width:100%;max-width:400px;padding:40px;background:#fff;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.08);border:1px solid #E2E8F0}
.card h2{text-align:center;font-size:20px;margin-bottom:4px;color:#1F2937}
.card .sub{text-align:center;color:#6B7280;font-size:13px;margin-bottom:28px}
</style></head><body>
<div id="app"><div class="card"><h2>用户注册</h2><p class="sub">森码云实人认证系统</p>
{if $is_mobile}
<van-form @submit="register"><van-cell-group inset><van-field v-model="form.username" label="用户名" placeholder="至少3个字符" :rules="[{required:true}]"/><van-field v-model="form.password" type="password" label="密码" placeholder="至少6个字符" :rules="[{required:true}]"/><van-field v-model="form.email" label="邮箱" placeholder="选填"/></van-cell-group><div style="margin:20px 16px"><van-button round block type="primary" native-type="submit" :loading="loading">注册</van-button></div></van-form>
<div style="text-align:center"><van-button size="small" @click="goLogin">已有账号？立即登录</van-button></div>
{else}
<el-form :model="form" :rules="rules" ref="formRef" @submit.prevent="register"><el-form-item prop="username"><el-input v-model="form.username" placeholder="用户名（至少3个字符）" prefix-icon="User"/></el-form-item><el-form-item prop="password"><el-input v-model="form.password" type="password" placeholder="密码（至少6个字符）" show-password prefix-icon="Lock"/></el-form-item><el-form-item><el-input v-model="form.email" placeholder="邮箱（选填）" prefix-icon="Message"/></el-form-item><el-form-item><el-button type="primary" native-type="submit" :loading="loading" style="width:100%">注册</el-button></el-form-item></el-form>
<div style="text-align:center"><el-link type="primary" @click="goLogin">已有账号？立即登录</el-link></div>
{/if}
<div style="text-align:center;margin-top:16px"><a href="/" style="font-size:12px;color:#9CA3AF;text-decoration:none">返回首页</a></div>
</div></div>
<script>
const {createApp,ref,reactive}=Vue;
const app=createApp({setup(){
    const form=reactive({username:'',password:'',email:''});
    const rules={username:[{required:true,message:'请输入用户名',trigger:'blur'},{min:3,message:'至少3个字符'}],password:[{required:true,message:'请输入密码',trigger:'blur'},{min:6,message:'至少6个字符'}]};
    const formRef=ref(null);const loading=ref(false);
    async function register(){
        {if $is_mobile}else{const valid=await formRef.value.validate().catch(()=>false);if(!valid)return;}
        loading.value=true;
        try{const r=await axios.post('/user/register',form);if(r.data.code===200)window.location.href='/user/center';else {if $is_mobile}Vant.showToast(r.data.msg||'注册失败'){else}ElementPlus.ElMessage.error(r.data.msg||'注册失败'){/if}}
        catch(e){ {if $is_mobile}Vant.showToast('网络错误'){else}ElementPlus.ElMessage.error('网络错误'){/if} }
        loading.value=false;
    }
    function goLogin(){window.location.href='/user/login'}
    return{form,rules,formRef,loading,register,goLogin};
}});
{if $is_mobile}app.use(vant){else}app.use(ElementPlus){/if}
app.mount('#app');
</script></body></html>
