<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>接口管理 - {$site_name}</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/element-plus"></script><script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#F8FAFC;color:#1F2937;display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:#fff;border-right:1px solid #E2E8F0;position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side-h{padding:18px 20px;border-bottom:1px solid #E2E8F0;font-size:16px;font-weight:700;color:#4F46E5}
.side-nav{padding:12px 0}.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#6B7280;text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all .15s}
.side-nav a:hover{color:#1F2937;background:#F1F5F9}.side-nav a.active{color:#4F46E5;background:#EEF2FF;border-left-color:#4F46E5;font-weight:500}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:40}
.topbar h2{font-size:17px;font-weight:600}.content{flex:1;padding:28px}
@media(max-width:768px){.sidebar{width:56px}.side-nav a span,.side-h{display:none}.main{margin-left:56px}.content{padding:14px}}
</style></head><body>
<aside class="sidebar"><div class="side-h">&#128737; 森码云</div><nav class="side-nav">
<a href="/admin/dashboard">&#9632; 控制台</a><a href="/admin/driver" class="active">&#9881; 接口管理</a>
<a href="/admin/record">&#9776; 认证记录</a><a href="/admin/audit">&#9745; 人工审核</a>
<a href="/admin/token">&#128273; Token管理</a><a href="/admin/setting">&#9881; 系统设置</a><a href="/admin/plugin">&#128230; 插件中心</a>
</nav><div style="border-top:1px solid #E2E8F0;padding:8px 0"><a href="/" style="display:flex;align-items:center;gap:8px;padding:10px 20px;color:#6B7280;text-decoration:none;font-size:13px">&#8962; 返回首页</a></div></aside>
<main class="main"><div class="topbar"><h2>接口管理</h2></div><div class="content"><div id="app">
<el-card><p style="color:#6B7280;margin-bottom:20px">管理人脸识别接口驱动。自研接口默认启用，第三方接口需配置密钥后方可使用。</p>
<el-table :data="drivers" style="width:100%">
<el-table-column prop="name" label="接口名称" width="200"><template #default="{row}"><strong>{{row.name}}</strong> <span style="font-size:11px;color:#9CA3AF;font-family:monospace">{{row.code}}</span></template></el-table-column>
<el-table-column prop="desc" label="说明"></el-table-column>
<el-table-column label="状态" width="120"><template #default="{row}"><el-tag :type="row.enabled?'success':'danger'">{{row.enabled?'已启用':'已禁用'}}</el-tag><el-tag v-if="row.isDefault" type="info" style="margin-left:4px">默认</el-tag></template></el-table-column>
<el-table-column label="操作" width="200"><template #default="{row}"><el-button size="small" @click="openConfig(row)">配置</el-button></template></el-table-column>
</el-table></el-card>
<el-dialog v-model="dialogVisible" :title="'配置 - '+currentDriver.name" width="500px"><el-form>
<el-form-item v-for="f in currentDriver.fields" :key="f.k" :label="f.l"><el-input v-model="currentDriver.config[f.k]" type="password" show-password /></el-form-item>
<el-form-item><el-checkbox v-model="currentDriver.enabled">启用此接口</el-checkbox><el-checkbox v-model="currentDriver.isDefault" style="margin-left:12px">设为默认</el-checkbox></el-form-item>
</el-form><template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="saveConfig">保存配置</el-button></template></el-dialog>
</div></div></main>
<script>
const {createApp,ref,reactive}=Vue;
createApp({setup(){
    const drivers=ref([
        {code:'self',name:'自研活体检测',desc:'默认启用，无需配置。基于GD库实现图像质量检测、亮度分析、纹理复杂度分析。',fields:[],enabled:true,isDefault:true,config:{}},
        {code:'tencent',name:'腾讯云慧眼',desc:'需开通腾讯云人脸核身服务。',fields:[{k:'secret_id',l:'SecretId'},{k:'secret_key',l:'SecretKey'},{k:'region',l:'地域'}],enabled:false,isDefault:false,config:{secret_id:'',secret_key:'',region:'ap-guangzhou'}},
        {code:'baidu',name:'百度智能云',desc:'需开通百度智能云人脸识别服务。',fields:[{k:'api_key',l:'API Key'},{k:'secret_key',l:'Secret Key'},{k:'app_id',l:'App ID'}],enabled:false,isDefault:false,config:{api_key:'',secret_key:'',app_id:''}},
        {code:'alipay',name:'支付宝活体检测',desc:'需开通支付宝开放平台。',fields:[{k:'app_id',l:'AppId'},{k:'private_key',l:'应用私钥'},{k:'alipay_public_key',l:'支付宝公钥'}],enabled:false,isDefault:false,config:{app_id:'',private_key:'',alipay_public_key:''}},
        {code:'juhe',name:'聚合数据',desc:'需注册聚合数据。',fields:[{k:'api_key',l:'API Key'}],enabled:false,isDefault:false,config:{api_key:''}},
        {code:'aliyun_market',name:'阿里云市场',desc:'需在阿里云市场订阅。',fields:[{k:'app_code',l:'AppCode'}],enabled:false,isDefault:false,config:{app_code:''}},
    ]);
    const dialogVisible=ref(false);const currentDriver=ref({});
    function openConfig(row){currentDriver.value=JSON.parse(JSON.stringify(row));dialogVisible.value=true}
    async function saveConfig(){
        try{await axios.post('/admin/driver/save',{driver_code:currentDriver.value.code,config:JSON.stringify(currentDriver.value.config),enabled:currentDriver.value.enabled?1:0,is_default:currentDriver.value.isDefault?1:0});dialogVisible.value=false;ElementPlus.ElMessage.success('保存成功');window.location.reload()}
        catch(e){ElementPlus.ElMessage.error('保存失败')}
    }
    return{drivers,dialogVisible,currentDriver,openConfig,saveConfig};
}}).use(ElementPlus).mount('#app');
</script></body></html>
