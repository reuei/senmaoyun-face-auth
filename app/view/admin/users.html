<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>用户管理 - {$site_name}</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/element-plus"></script><script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#F8FAFC;color:#1F2937;display:flex;min-height:100vh;line-height:1.5}
.sidebar{width:220px;background:#fff;border-right:1px solid #E2E8F0;position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side-h{padding:18px 20px;border-bottom:1px solid #E2E8F0;font-size:16px;font-weight:700;color:#4F46E5}
.side-nav{padding:12px 0}.side-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#6B7280;text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all .15s}
.side-nav a:hover{color:#1F2937;background:#F1F5F9}.side-nav a.active{color:#4F46E5;background:#EEF2FF;border-left-color:#4F46E5;font-weight:500}
.main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:40}
.topbar h2{font-size:17px;font-weight:600}.content{flex:1;padding:28px}
@media(max-width:768px){.sidebar{width:56px}.side-nav a span,.side-h{display:none}.main{margin-left:56px}.content{padding:14px}}
</style></head><body>
<aside class="sidebar"><div class="side-h">&#128737; 森码云</div><nav class="side-nav">
<a href="/admin/dashboard">&#9632; 控制台</a><a href="/admin/driver">&#9881; 接口管理</a>
<a href="/admin/record">&#9776; 认证记录</a><a href="/admin/audit">&#9745; 人工审核</a>
<a href="/admin/token">&#128273; Token管理</a><a href="/admin/users" class="active">&#128101; 用户管理</a>
<a href="/admin/setting">&#9881; 系统设置</a><a href="/admin/plugin">&#128230; 插件中心</a>
</nav><div style="border-top:1px solid #E2E8F0;padding:8px 0"><a href="/" style="display:flex;align-items:center;gap:8px;padding:10px 20px;color:#6B7280;text-decoration:none;font-size:13px">&#8962; 返回首页</a><a href="/admin/logout" style="display:flex;align-items:center;gap:8px;padding:10px 20px;color:#6B7280;text-decoration:none;font-size:13px">&#10149; 退出登录</a></div></aside>
<main class="main"><div class="topbar"><h2>用户管理</h2></div><div class="content"><div id="app">
<el-card><el-table :data="list" stripe><el-table-column prop="id" label="ID" width="60"/><el-table-column prop="username" label="用户名" width="120"/><el-table-column prop="nickname" label="昵称" width="120"/><el-table-column prop="email" label="邮箱"/><el-table-column prop="certify_status" label="认证" width="80"><template #default="{row}"><el-tag :type="row.certify_status?'success':'info'">{{row.certify_status?'已认证':'未认证'}}</el-tag></template></el-table-column>
<el-table-column prop="status" label="状态" width="80"><template #default="{row}"><el-tag :type="row.status?'success':'danger'">{{row.status?'正常':'禁用'}}</el-tag></template></el-table-column>
<el-table-column prop="last_login_time" label="最后登录" width="160"/>
<el-table-column label="操作" width="100"><template #default="{row}"><el-switch v-model="row.status" :active-value="1" :inactive-value="0" @change="toggle(row)"/></template></el-table-column>
</el-table><el-pagination v-if="total>20" style="margin-top:16px;text-align:center" :current-page="page" :page-size="20" :total="total" layout="prev,pager,next,total" @current-change="load"/></el-card>
</div></div></main>
<script>
const {createApp,ref}=Vue;
createApp({setup(){
    const list=ref([]);const page=ref(1);const total=ref(0);
    async function load(p){page.value=p||1;try{const r=await axios.post('/admin/users/list',{page:page.value});if(r.data.code===200){list.value=r.data.data.list;total.value=r.data.data.total}}catch(e){}}
    async function toggle(row){try{await axios.post('/admin/users/toggle',{id:row.id,status:row.status});ElementPlus.ElMessage.success('操作成功')}catch(e){ElementPlus.ElMessage.error('操作失败')}}
    load(1);
    return{list,page,total,load,toggle};
}}).use(ElementPlus).mount('#app');
</script></body></html>
